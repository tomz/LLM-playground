# Tiny synthetic correctness recipe, not a quality or throughput benchmark.
run_id: repair_cpu
out_dir: out/repair_cpu
seed: 31
dtype: float32
log:
  jsonl: true
  wandb_project: null
data:
  dir: data/repair/train
  val_dir: data/repair/validation
  seq_len: 8
model:
  vocab_size: 32
  n_layer: 2
  n_head: 4
  n_kv_head: 2
  d_model: 32
  d_ffn: 64
  max_seq_len: 8
  tie_embeddings: true
parallel:
  dp: -1
  tp: 1
  pp: 1
  zero: none
  activation_ckpt: none
optim:
  optimizer: adamw
  lr: 0.001
  min_lr: 0.0001
  betas: [0.9, 0.95]
  weight_decay: 0.1
  grad_clip: 0.05
  warmup_steps: 1
  total_steps: 4
train:
  micro_batch: 2
  grad_accum: 2
  log_every: 1
  eval_every: 1
  eval_batches: 2
  ckpt_every: 1
  compile: false
  fp8: 'off'
