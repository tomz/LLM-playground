# Cooldown / annealing recipe — short LR-decay phase after base pre-training.
#
# Pattern: train base model with the standard cosine to its `min_lr`, then
# run this recipe for ~5–10% of base steps with an extremely low LR
# (~0.05 * min_lr) on a HIGH-QUALITY data mix (deduped, decontaminated,
# math/code/reasoning oversampled). Public references:
#   - DeepSeek-V3, Llama-3, Qwen-2 all use this pattern.
#   - Rule of thumb: cooldown_steps ≈ 0.05–0.10 × total_steps.
#
# Picks up a final 1–2 pp on benchmark numbers for ~5% extra compute.
#
# Usage:
#   # 1. Train base model:
#   torchrun ... -m distgpt.cli train --config configs/1b.yaml
#   # 2. Cool down:
#   torchrun ... -m distgpt.cli train --config configs/recipes/cooldown.yaml \
#       --data data/high_quality_mix
#
# The `load_ckpt:` knob loads weights only — fresh optim, fresh loader,
# step counter resets to 0 so the cosine schedule below starts from the
# top of the cooldown phase rather than from where pre-training left off.
run_id: gpt_1b_cooldown
out_dir: out/cooldown

# Path to the base-pretrain checkpoint. Edit to match your setup.
# This is a directory like `out/1b/gpt_1b/ckpts/step_000060000`.
load_ckpt: out/1b/gpt_1b/ckpts/step_000060000

data: {dir: data/high_quality_mix, seq_len: 4096}
seed: 1337
dtype: bfloat16
log: {jsonl: true, wandb_project: null}

model:
  vocab_size: 50304
  n_layer: 24
  n_head: 16
  n_kv_head: 8
  d_model: 2048
  d_ffn: 5632
  max_seq_len: 4096
  rope_base: 10000.0
  tie_embeddings: true

parallel:
  dp: -1
  tp: 1
  pp: 1
  zero: fsdp
  activation_ckpt: none

optim:
  optimizer: adamw
  lr: 1.5e-6           # 0.05 * min_lr from configs/1b.yaml (3e-5)
  min_lr: 1.5e-7
  betas: [0.9, 0.95]
  weight_decay: 0.1
  grad_clip: 1.0
  warmup_steps: 0      # no re-warmup; we're already at the bottom of cosine
  total_steps: 6000    # ~10% of the 60k base run

train:
  micro_batch: 4
  grad_accum: 8
  log_every: 20
  eval_every: 500
  ckpt_every: 2000
  compile: true
  fp8: off
