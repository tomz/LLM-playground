# DeepSeek-V3-style recipe: MoE + MLA + MTP all on at tiny scale.
#
# A laptop-runnable showcase that wires together the three architectural
# primitives added in distgpt Tier 5 (MoE 5.12, MLA 5.13, MTP 5.14).
# Sized so a CPU-only smoke test can run it in a few seconds; for a real
# small-scale training run, scale up `model.*` and `train.total_steps`.
#
# All three features default-off in the dense baseline; this recipe is the
# integration test that they compose. It is NOT a fully tuned recipe — the
# point is to prove the moving parts work together without a NotImplementedError
# (e.g. `tp > 1` with MoE/MLA is intentionally rejected by `parallel/tensor.py`
# so this recipe stays at tp=1 / single-process).
#
# Architectural choices (mirror DeepSeek-V3 §2-3, miniaturised):
#   * MLA over GQA — 5-10x KV cache compression at near-equal quality.
#   * Sparse-MoE FFN with one always-on shared expert and aux-loss-free
#     bias-based load balancing (the 2025 frontier default).
#   * Multi-Token Prediction with 2 auxiliary heads (predict +2, +3
#     tokens) to densify the gradient. Train-only, stripped at HF export.
#
run_id: deepseek_v3_style_tiny
out_dir: out/deepseek_v3_style_tiny

data: {dir: data/tiny, seq_len: 64}
seed: 1337
dtype: float32                  # fp32 keeps it CPU-runnable
log: {jsonl: true, wandb_project: null}

model:
  vocab_size: 1024
  n_layer: 2
  n_head: 4
  n_kv_head: 2                  # ignored under attn_kind=mla but kept for clarity
  d_model: 64
  d_ffn: 128                    # unused when MoE is on (see moe_expert_d_ffn)
  max_seq_len: 64
  rope_base: 10000.0
  tie_embeddings: true

  # ---- MLA (Tier 5.13) ----
  attn_kind: mla
  mla_kv_latent_dim: 32         # the cached quantity per token
  mla_rope_head_dim: 8          # < head_dim (16); rest is nope (content)

  # ---- Sparse MoE (Tier 5.12) ----
  moe_num_experts: 4            # routed pool size
  moe_top_k: 2                  # per-token expert count
  moe_shared_experts: 1         # DeepSeek-V3 uses 1 always-on shared expert
  moe_expert_d_ffn: 64          # each expert's SwiGLU hidden dim
  moe_balance: aux_free         # bias-nudge load balancer (no quality penalty)
  moe_bias_update_speed: 1.0e-3
  moe_aux_loss_weight: 1.0      # router z-loss into main loss
  moe_dispatch: batched         # production dispatch (sort-by-expert + GEMM)

  # ---- Multi-Token Prediction (Tier 5.14) ----
  mtp_tokens: 2                 # auxiliary heads at offsets +2, +3
  mtp_weight: 0.3               # weight on averaged MTP CE

parallel:
  dp: 1
  tp: 1                         # MoE/MLA + tp>1 raises NotImplementedError (Tier 6)
  pp: 1
  zero: none
  activation_ckpt: none

optim:
  optimizer: adamw              # muon also works; adamw keeps the recipe portable
  lr: 1.0e-3
  min_lr: 1.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.1
  grad_clip: 1.0
  warmup_steps: 1
  total_steps: 3                # bumped to 30k+ for a real run

train:
  micro_batch: 2
  grad_accum: 1
  log_every: 1
  eval_every: 99
  ckpt_every: 99
  compile: false
  fp8: off
