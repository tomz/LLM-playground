# Long-context fine-tune: extend a base-pretrained model from 4K → 32K context.
#
# Strategy: rope_base scaling + a short LR-decayed fine-tune phase on a
# long-context data mix. Two non-obvious knobs:
#
#   1. rope_base bumped 10000 → 500000 (50× freq spread → enough slack for
#      8× context extension). This is the YaRN-style "linear interpolation"
#      approximation; cheap and effective up to ~4× context extension. For
#      bigger jumps use proper YaRN scaling (not in this recipe).
#
#   2. seq_len 4096 → 32768. Memory scales linearly with seq_len under
#      flash-attention, quadratically under SDPA without flash. We enable
#      `parallel.sequence_parallel: true` to amortise the norm-activation
#      cost across TP ranks — a big memory win at long context.
#
# Expected throughput: ~25% of base-pretrain tok/s (at 32K vs 4K), memory
# 2–3× the base run; budget accordingly. ~10B tokens of long-context
# fine-tune is typically enough to lift 32K perplexity to ~equal the 4K
# baseline.
#
run_id: gpt_1b_longctx32k
out_dir: out/longctx32k

# Warm-start from the 4K base. Fresh optim + fresh loader; the new RoPE
# base means the schedule for the rotational embeddings is new too, so
# we don't try to carry over the AdamW state.
load_ckpt: out/1b/gpt_1b/ckpts/step_000060000

data: {dir: data/longctx-32k, seq_len: 32768}
seed: 1337
dtype: bfloat16
log: {jsonl: true, wandb_project: null}

model:
  vocab_size: 50304
  n_layer: 24
  n_head: 16
  n_kv_head: 8
  d_model: 2048
  d_ffn: 5632
  max_seq_len: 32768   # was 4096 — must match new seq_len
  rope_base: 500000.0  # was 10000 — linear-interp extension to 32K
  tie_embeddings: true

parallel:
  dp: -1
  tp: 8                # SP only helps when tp>1
  pp: 1
  zero: fsdp
  activation_ckpt: full        # full recompute is cheap relative to long-context savings
  sequence_parallel: true      # the big memory win

optim:
  optimizer: adamw     # don't experiment with Muon during fine-tune
  lr: 5.0e-5           # ~6× lower than base-pretrain peak; fine-tune regime
  min_lr: 5.0e-6
  betas: [0.9, 0.95]
  weight_decay: 0.0    # WD off for fine-tune
  grad_clip: 1.0
  warmup_steps: 200
  total_steps: 2000

train:
  micro_batch: 1       # 32K context is memory-hungry
  grad_accum: 32       # effective batch ~1M tokens / step
  log_every: 5
  eval_every: 100
  ckpt_every: 500
  compile: false       # compile + SP + activation_ckpt rarely composes cleanly
  fp8: off
