run_id: gpt_70b
out_dir: out/70b
data: {dir: data/tiny, seq_len: 4096}
seed: 1337
dtype: bfloat16
log: {jsonl: true, wandb_project: null}

model:
  vocab_size: 50304
  n_layer: 80
  n_head: 64
  n_kv_head: 8
  d_model: 8192
  d_ffn: 28672
  max_seq_len: 4096
  rope_base: 10000.0
  tie_embeddings: false

parallel:
  dp: -1
  tp: 8
  pp: 8
  zero: zero1
  activation_ckpt: selective

optim:
  lr: 8.0e-5
  min_lr: 8.0e-6
  betas: [0.9, 0.95]
  weight_decay: 0.1
  grad_clip: 1.0
  warmup_steps: 4000
  total_steps: 600000

train:
  micro_batch: 1
  grad_accum: 32
  log_every: 10
  eval_every: 1000
  ckpt_every: 2000
