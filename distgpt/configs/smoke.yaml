# Tiny 50M-param config for 2-GPU smoke runs on heterogeneous consumer hardware.
run_id: smoke
out_dir: out/smoke
data: {dir: data/tiny, seq_len: 512}
seed: 1337
dtype: float32          # P100 has no BF16; play it safe across both GPUs
log: {jsonl: true, wandb_project: null}

model:
  vocab_size: 50304
  n_layer: 8
  n_head: 8
  n_kv_head: 8
  d_model: 512
  d_ffn: 1408
  max_seq_len: 512
  rope_base: 10000.0
  tie_embeddings: true

parallel:
  dp: -1
  tp: 1
  pp: 1
  zero: fsdp
  activation_ckpt: none

optim:
  lr: 3.0e-4
  min_lr: 3.0e-5
  betas: [0.9, 0.95]
  weight_decay: 0.1
  grad_clip: 1.0
  warmup_steps: 20
  total_steps: 200

train:
  micro_batch: 4
  grad_accum: 2
  log_every: 10
  eval_every: 100
  ckpt_every: 100
