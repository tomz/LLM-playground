run_id: gpt_1b
out_dir: out/1b
data: {dir: data/tiny, seq_len: 4096}
seed: 1337
dtype: bfloat16
log: {jsonl: true, wandb_project: null}

model:
  vocab_size: 50304
  n_layer: 24
  n_head: 16
  n_kv_head: 8
  d_model: 2048
  d_ffn: 5632
  max_seq_len: 4096
  rope_base: 10000.0
  tie_embeddings: true
  # Stability knobs (default-off; safe under TP). Flip on to push LR harder:
  qk_norm: false          # per-head RMSNorm on Q/K before RoPE
  zero_init_proj: false   # identity-init blocks for stable high-LR warmup

parallel:
  dp: -1     # -1 = fill remaining
  tp: 1
  pp: 1
  zero: fsdp           # 'fsdp' | 'zero1' | 'none'
  activation_ckpt: none

optim:
  lr: 3.0e-4
  min_lr: 3.0e-5
  betas: [0.9, 0.95]
  weight_decay: 0.1
  grad_clip: 1.0
  warmup_steps: 1000
  total_steps: 60000

train:
  micro_batch: 4
  grad_accum: 8
  log_every: 10
  eval_every: 1000
  ckpt_every: 2000
