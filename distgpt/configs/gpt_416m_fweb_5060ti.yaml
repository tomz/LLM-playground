# 5060 Ti single-GPU recipe — 416M Llama-arch GPT on FineWeb-Edu.
#
# distgpt is a multi-node framework, but every code path EXCEPT the actual
# cross-GPU collectives is exercised by a single-rank run:
#   * GPT (RoPE + RMSNorm + SwiGLU + GQA) forward/backward
#   * 3D mesh build with dp=1, tp=1, pp=1
#   * StreamingLoader + LoaderState (DCP-resumable)
#   * CheckpointManager with DCP sharded save/load
#   * SpikeMonitor + RewindController (loss-spike detection)
#   * AdamW + cosine + per-group WD
#   * BF16 autocast
#
# What single-rank does NOT exercise: FSDP all-gather / reduce-scatter,
# TP column/row linears, PP 1F1B schedule, NCCL. For those, you need
# real multi-GPU hardware -- see the reference topologies in README.md
# and scripts/smoke_2gpu.sh.
#
# Why not 2 ranks on one 5060 Ti?
#   NCCL 2.28 hard-rejects two ranks bound to the same physical GPU
#   ("Duplicate GPU detected"). NVIDIA MPS does not bypass this check.
#   Forcing gloo backend works but is ~50x slower per FSDP all-gather --
#   24 hours for the 2000-step run vs 30 minutes via NCCL on real 2 GPUs.
#
run_id: gpt_416m_fweb_5060ti
out_dir: out/gpt_416m_fweb_5060ti
data: {dir: data/fineweb-edu, seq_len: 1024}
seed: 1337
dtype: bfloat16
log: {jsonl: true, wandb_project: null}

model:
  vocab_size: 50304
  n_layer: 24
  n_head: 16
  n_kv_head: 4         # GQA 4:1
  d_model: 1024
  d_ffn: 4096
  max_seq_len: 1024
  rope_base: 10000.0
  tie_embeddings: true

parallel:
  dp: -1               # -> 1 at world_size=1
  tp: 1
  pp: 1
  zero: fsdp           # no-op at dp=1 (FSDP wraps only when mesh.size() > 1)
  activation_ckpt: none   # 5060 Ti / 16 GB fits 416M at micro_batch=4 without it

optim:
  lr: 3.0e-4
  min_lr: 3.0e-5
  betas: [0.9, 0.95]
  weight_decay: 0.1
  grad_clip: 1.0
  warmup_steps: 150
  total_steps: 3000

train:
  micro_batch: 4
  grad_accum: 8        # eff batch = 32 sequences = 32768 tok / step
  log_every: 10
  eval_every: 200
  ckpt_every: 500
