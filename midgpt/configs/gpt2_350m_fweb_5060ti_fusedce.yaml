# 350M GPT-2 on a 1B-token FineWeb-Edu slice — fused_ce SHOWCASE.
#
# Byte-for-byte identical to gpt2_350m_fweb_5060ti.yaml (the AdamW baseline)
# EXCEPT fused_ce is turned ON. That isolation is the whole point: Liger's
# fused-linear-cross-entropy is numerically EXACT (verified on this model —
# loss diff 1.8e-3, grad rel-diff ~8e-3, i.e. bf16 rounding), so the loss
# curve must land ON TOP of the baseline. What changes is throughput and VRAM:
# the [B*T, vocab] logits — the single largest forward activation — are never
# materialized. Measured peak VRAM ~9.7 GiB here vs ~12.8 GiB for the baseline.
#
# This is a SHORT run (800 iters): just enough to (a) confirm the val curve
# overlays the baseline and (b) capture steady-state ms/iter + peak VRAM. The
# full-length science is the baseline run; fused_ce only moves the cost axes.
#
# Tuned for RTX 5060 Ti 16 GB (Blackwell sm_120, native bf16). Needs
# `pip install liger-kernel` + a Triton GPU.
#
out_dir: out/gpt2_350m_fweb_5060ti_fusedce
dataset: fineweb-edu
tokenizer: gpt2
seed: 1337
dtype: bfloat16
compile: false
grad_checkpoint: false
fused_ce: true            # the only delta vs gpt2_350m_fweb_5060ti.yaml
log: {jsonl: true, wandb_project: null}

model:
  vocab_size: 50304
  block_size: 1024
  n_layer: 24
  n_head: 16
  d_model: 1024
  d_ffn: 4096
  dropout: 0.0
  bias: false
  tie_embeddings: true

optim:
  lr: 3.0e-4
  min_lr: 3.0e-5
  betas: [0.9, 0.95]
  weight_decay: 0.1
  grad_clip: 1.0
  warmup_iters: 200       # identical schedule to the baseline so the first
  lr_decay_iters: 4000    # 800 iters trace the SAME cosine curve for overlay
  max_iters: 800

train:
  micro_batch: 4
  grad_accum: 8           # eff batch = 32 sequences = 32,768 tok/step
  eval_interval: 200      # 4 eval points (200/400/600/800)
  eval_iters: 50
  log_interval: 10
  ckpt_interval: 100000   # no mid-run checkpoints for a throwaway showcase
