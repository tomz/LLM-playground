# 350M GPT-2 (Arm A) — 2-GPU iso-token variant of gpt2_350m_fweb_5060ti.yaml.
# Part of the Track B1 architecture A/B (see
# examples/5060ti_350m_llamafied_AB.NEXT_STEPS.md). This is the GPT-2 baseline
# arm (learned-pos + LayerNorm + GELU d_ffn 4096) re-run under the *identical*
# 2-GPU DDP harness as the llamafied arm, so the only difference between the
# two runs is architecture — no single-GPU-vs-DDP confound.
#
# grad_accum halved 8 -> 4 so that
#   4(micro_batch) x 4(grad_accum) x 2(world) x 1024(block) = 32768 tok/step
# matches the single-GPU baseline exactly. Same 4000-iter schedule => 131M
# training tokens, same cosine LR. The existing single-GPU run
# (out/gpt2_350m_fweb_5060ti, val ppl 58.2) doubles as a DDP-reproducibility
# check: this 2-GPU A-side should land within noise of it.
#
out_dir: out/gpt2_350m_fweb_5060ti_2gpu
dataset: fineweb-edu
tokenizer: gpt2
seed: 1337
dtype: bfloat16
compile: false
grad_checkpoint: false
log: {jsonl: true, wandb_project: null}

model:
  vocab_size: 50304
  block_size: 1024
  n_layer: 24
  n_head: 16
  d_model: 1024
  d_ffn: 4096
  dropout: 0.0
  bias: false
  tie_embeddings: true

optim:
  lr: 3.0e-4
  min_lr: 3.0e-5
  betas: [0.9, 0.95]
  weight_decay: 0.1
  grad_clip: 1.0
  warmup_iters: 200       # 5% of max_iters
  lr_decay_iters: 4000    # full cosine over the whole run
  max_iters: 4000

train:
  micro_batch: 4
  grad_accum: 4           # 4*4*2*1024 = 32768 tok/step (iso with baseline)
  eval_interval: 200      # 20 eval points across the run
  eval_iters: 50          # 50 × 4 × 1024 = ~200k val tokens per eval
  log_interval: 10
  ckpt_interval: 500
