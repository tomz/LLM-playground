out_dir: out/smoke_124m
dataset: wikitext103
tokenizer: gpt2
seed: 1337
dtype: bfloat16
compile: false
grad_checkpoint: true
log: {jsonl: true, wandb_project: null}

model:
  vocab_size: 50304
  block_size: 256
  n_layer: 12
  n_head: 12
  d_model: 768
  d_ffn: 3072
  dropout: 0.0
  bias: false
  tie_embeddings: true

optim:
  lr: 6.0e-4
  min_lr: 6.0e-5
  betas: [0.9, 0.95]
  weight_decay: 0.1
  grad_clip: 1.0
  warmup_iters: 20
  lr_decay_iters: 200
  max_iters: 200

train:
  micro_batch: 2
  grad_accum: 2
  eval_interval: 50
  eval_iters: 10
  log_interval: 10
  ckpt_interval: 100
