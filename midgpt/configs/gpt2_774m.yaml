out_dir: out/gpt2_774m
dataset: openwebtext
tokenizer: gpt2
seed: 1337
dtype: bfloat16
compile: true
grad_checkpoint: true
log: {jsonl: true, wandb_project: null}

model:
  vocab_size: 50304
  block_size: 1024
  n_layer: 36
  n_head: 20
  d_model: 1280
  d_ffn: 5120
  dropout: 0.0
  bias: false
  tie_embeddings: true

optim:
  lr: 2.5e-4
  min_lr: 2.5e-5
  betas: [0.9, 0.95]
  weight_decay: 0.1
  grad_clip: 1.0
  warmup_iters: 1500
  lr_decay_iters: 250000
  max_iters: 250000

train:
  micro_batch: 4
  grad_accum: 16
  eval_interval: 2000
  eval_iters: 200
  log_interval: 20
  ckpt_interval: 5000
