# 350M GPT-2 on a 1B-token FineWeb-Edu slice — feature-flag variant of
# gpt2_350m_fweb_5060ti.yaml. Identical architecture / data / iters / schedule.
#
# STATUS: this file pairs a SHIPPED, working feature with a documented
# KNOWN-UNSTABLE one — keep them straight:
#
#   * fused_ce: true   — ✅ SHIPPED. Liger fused-linear-cross-entropy fuses the
#     lm_head matmul + softmax-CE and never materializes the [B*T, vocab]
#     logits. Numerically EXACT (verified: loss diff 1.8e-3, grad rel-diff
#     ~8e-3 = bf16 noise), so it only moves the cost axes, never the loss
#     curve. The win is VRAM (~10.1 vs 12.8 GiB, -20%); on this sm_120 box it
#     also costs ~26% throughput (10.8k vs 14.5k tok/s) — a headroom lever, not
#     a speedup. Needs `pip install liger-kernel` + a Triton GPU.
#     For the honest fused_ce showcase use gpt2_350m_fweb_5060ti_fusedce.yaml.
#   * optimizer: muon  — ⚠ KNOWN-UNSTABLE on this 350M net (diverges; see the
#     optim block). Kept here only as a reproducer. Do NOT treat as a recipe.
#
# Tuned for RTX 5060 Ti 16 GB (Blackwell sm_120, native bf16).
#
out_dir: out/gpt2_350m_fweb_5060ti_muon
dataset: fineweb-edu
tokenizer: gpt2
seed: 1337
dtype: bfloat16
compile: false
grad_checkpoint: false
fused_ce: true            # Liger fused-linear-CE (exact; throughput/VRAM win)
log: {jsonl: true, wandb_project: null}

model:
  vocab_size: 50304
  block_size: 1024
  n_layer: 24
  n_head: 16
  d_model: 1024
  d_ffn: 4096
  dropout: 0.0
  bias: false
  tie_embeddings: true

optim:
  optimizer: muon         # Muon on 2D hidden weights; AdamW for the rest
  # ⚠ KNOWN-UNSTABLE on THIS 350M net — kept as a documented reproducer, not a
  # recommended recipe. Muon orthogonalizes each update to ~unit singular values
  # then scales by muon_lr·sqrt(dim), so the per-step update RMS ≈ muon_lr
  # *regardless of how small the weight is*. midgpt inits residual-proj weights
  # tiny (GPT-2 1/sqrt(2·n_layer) → std≈0.0029 at n_layer=24), so even muon_lr
  # 0.002 overwrites ~35% of the proj weight on step 0, and because
  # orthogonalization re-inflates shrinking grads back to unit scale, the step
  # never tapers near convergence. Result: loss descends through warmup then
  # plateaus/climbs (val froze ~6.8 while AdamW reached 4.47 at iter 1800).
  # Lower muon_lr only DELAYS divergence (0.002→0.10 all fail, just at different
  # speeds). The byte-identical Muon works in nanogpt-edu's 6-layer tiny net;
  # making it work here needs a recipe change (drop the tiny residual init for
  # Muon matrices, or add update-norm decay), not an LR tweak. See git log.
  muon_lr: 0.002          # least-bad value; still diverges after ~iter 300
  muon_momentum: 0.95
  lr: 3.0e-4              # AdamW LR for embeddings / pos_emb / lm_head / 1-D
  min_lr: 3.0e-5
  betas: [0.9, 0.95]
  weight_decay: 0.1
  grad_clip: 1.0
  warmup_iters: 200
  lr_decay_iters: 4000
  max_iters: 4000

train:
  micro_batch: 4
  grad_accum: 8
  eval_interval: 200
  eval_iters: 50
  log_interval: 10
  ckpt_interval: 500
