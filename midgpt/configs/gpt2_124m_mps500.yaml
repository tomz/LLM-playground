# 500-iter Apple-Silicon variant of gpt2_124m_mps. ~90 min on an M5 with
# 24 GB unified memory at micro_batch=4, grad_accum=16, block_size=512
# (32k tokens/step, 16M tokens total). Loss should drop from ~11 to ~6
# — enough to show warmup + the start of the cosine decay clearly.
out_dir: out/gpt2_124m_mps500
dataset: wikitext103
tokenizer: gpt2
seed: 1337
dtype: bfloat16
compile: false
grad_checkpoint: true
log: {jsonl: true, wandb_project: null}

model:
  vocab_size: 50304
  block_size: 512
  n_layer: 12
  n_head: 12
  d_model: 768
  d_ffn: 3072
  dropout: 0.0
  bias: false
  tie_embeddings: true

optim:
  lr: 6.0e-4
  min_lr: 6.0e-5
  betas: [0.9, 0.95]
  weight_decay: 0.1
  grad_clip: 1.0
  warmup_iters: 50
  lr_decay_iters: 500
  max_iters: 500

train:
  micro_batch: 4
  grad_accum: 16
  eval_interval: 50
  eval_iters: 30
  log_interval: 10
  ckpt_interval: 250
