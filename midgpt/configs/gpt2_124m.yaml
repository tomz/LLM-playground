out_dir: out/gpt2_124m
dataset: wikitext103     # subdir of data/
tokenizer: gpt2          # tiktoken encoding name
seed: 1337
dtype: bfloat16
compile: false
grad_checkpoint: false   # 124M fits without it
log: {jsonl: true, wandb_project: null}

model:
  vocab_size: 50304       # 50257 padded to mult of 64 for tensor cores
  block_size: 1024
  n_layer: 12
  n_head: 12
  d_model: 768
  d_ffn: 3072
  dropout: 0.0
  bias: false
  tie_embeddings: true

optim:
  lr: 6.0e-4
  min_lr: 6.0e-5
  betas: [0.9, 0.95]
  weight_decay: 0.1
  grad_clip: 1.0
  warmup_iters: 500
  lr_decay_iters: 60000
  max_iters: 60000

train:
  micro_batch: 12        # per-GPU
  grad_accum: 40         # global tokens/step = micro_batch * grad_accum * world_size * block_size
  eval_interval: 1000
  eval_iters: 200
  log_interval: 10
  ckpt_interval: 2000
