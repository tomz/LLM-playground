# 5060 Ti recipe — Qwen2.5-Coder-3B LoRA on Magicoder-OSS-Instruct-Python.
#
# Hardware target: RTX 5060 Ti 16 GB (Blackwell, sm_120, native bf16). The
# 16 GB unlocks a tier the 3050 (8 GB) can't reach: a 3B base + real seq=1024
# + packing on, all without QLoRA. Compare:
#
#   3050 recipe (lora_3050_1p5b.yaml): 1.5B, seq=1024, packing=off, grad_ckpt
#     on, ~7.5 GB reserved, ~1.6 s/step.
#   5060 Ti recipe (this file):        3B,   seq=1024, packing=on,  grad_ckpt
#     off, ~10 GB reserved, ~1.0 s/step on packed sequences.
#
# Why packing + no grad_ckpt: with 16 GB to spare, trading the ~30 % recompute
# penalty of gradient checkpointing for raw throughput is the right call.
# Packing then ~2.5×s the effective tokens-per-step at zero memory cost,
# which is what actually moves the loss on a real instruction set.
#
out_dir: out/lora_5060ti
seed: 1337

model:
  name: Qwen/Qwen2.5-Coder-3B
  dtype: bfloat16
  attn_impl: sdpa
  trust_remote_code: false

method: lora

# Same shape as the 3050 recipes — keeps the comparison clean. r=16 is enough
# for SFT on a few-k Python rows; bumping to r=32 costs +1 % VRAM and gives
# marginal headroom for a longer training run if you want it.
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  bias: none
  target_modules: ['q_proj', 'k_proj', 'v_proj', 'o_proj',
                   'gate_proj', 'up_proj', 'down_proj']
  # SOTA adapter knobs (default off elsewhere for clean A/B; on here because
  # the 16 GB card has the headroom to absorb DoRA's ~15% step-time overhead).
  use_dora: true          # weight-decomposed LoRA — better quality at r=16
  use_rslora: true        # alpha/sqrt(r) scaling — lets the rank actually count

dataset:
  source: hf
  hf_name: ise-uiuc/Magicoder-OSS-Instruct-75K
  lang_filter: python      # 38,284 of 75,197 examples
  max_examples: 2500       # ~10 minutes wall-clock at packed seq=1024
  format: chatml

train:
  max_seq_len: 1024
  batch_size: 1            # bs=2 packed seq=1024 on 3B OOMs at ~15 GB; bs=1
                           # keeps peak ~10 GB and leaves room for activations
  grad_accum: 8            # effective batch = 8 (matches the 1.5B-on-3050 recipe)
  epochs: 1
  lr: 2.0e-4
  warmup_ratio: 0.03
  weight_decay: 0.0
  grad_clip: 1.0
  log_every: 10
  save_every: 100
  packing: true            # the big win on a 16 GB card — ~2.5× tokens/step
                           # for the same memory budget
  gradient_checkpointing: false   # 3B + r=16 LoRA + bs=2 fits without it
  # Liger Kernel: ~20% faster + big memory cut from FusedLinearCrossEntropy
  # over Qwen's ~150K vocab. Needs `pip install liger-kernel`.
  use_liger_kernel: true
  # NEFTune: embedding-noise regularizer, free quality bump for SFT.
  neftune_noise_alpha: 5

eval:
  enable: false
  n_problems: 50
  n_samples_per_problem: 1
