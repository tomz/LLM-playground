# Repo-wide tooling configuration. Each subproject still installs and tests
# independently — there is no top-level build target.

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = [
    ".venv*",
    "**/.venv*",
    "**/out/**",
    "**/data/**",
    "**/__pycache__/**",
    "examples/**",   # standalone demo scripts; not part of the five core projects
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # line too long — many existing lines are tightly packed; ruff format would relayout
    "E701",  # multiple statements on one line (used in compact training-loop code)
    "E702",  # ditto
    "E731",  # lambda assignments — used in scaling.py for compactness
    "E741",  # ambiguous variable name (we use `l`, `L`, etc. in math contexts)
    "E401",  # multiple imports on one line — repo style is compact `import a, b, c`
    "E402",  # module-level import not at top — many files insert sys.path before importing
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["F401"]  # test files often import for side effects
"**/configs/*.py" = ["F401", "F841"]  # nanogpt configs are dict literals

[tool.pytest.ini_options]
testpaths = []  # each subproject has its own pyproject/conftest
